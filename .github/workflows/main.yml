name: Windows RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:

      # ==========================================
      # 1. CREDENTIALS
      # ==========================================
      - name: Set Credentials
        shell: powershell
        run: |
          $RDP_PASSWORD = "Karthick@2026"
          $TAILSCALE_AUTHKEY = "tskey-auth-k698UnmFHW11CNTRL-hrrGqc92DdiWLJuSCLLXci4bzBhnGHhP"

          "RDP_PASSWORD=$RDP_PASSWORD" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "TAILSCALE_AUTHKEY=$TAILSCALE_AUTHKEY" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host "Credentials configured"

      # ==========================================
      # 2. ENABLE RDP
      # ==========================================
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

          Write-Host "RDP enabled"

      # ==========================================
      # 3. LOW-LAG SETTINGS
      # ==========================================
      - name: Optimize Windows for RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name Wallpaper `
            -Value ""

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Name MinAnimate `
            -Value 0

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name MenuShowDelay `
            -Value 0

          New-Item `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Force | Out-Null

          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name EnableTransparency `
            -Value 0

          Write-Host "Performance settings applied"

      # ==========================================
      # 4. CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |
          $Username = "RDP"
          $Password = $env:RDP_PASSWORD

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {

            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword

            Write-Host "RDP user password updated"

          } else {

            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires `
              -UserMayNotChangePassword

            Write-Host "RDP user created"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured"

      # ==========================================
      # 5. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $Installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait

          Write-Host "Tailscale installed"

      # ==========================================
      # 6. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        run: |
          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          $Hostname = "gh-rdp-$env:GITHUB_RUN_ID"

          & $TS up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="$Hostname"

          Start-Sleep -Seconds 5

          & $TS status

      # ==========================================
      # 7. GET TAILSCALE IP
      # ==========================================
      - name: Get Tailscale IP
        shell: powershell
        run: |
          $TS = "C:\Program Files\Tailscale\tailscale.exe"

          $IP = ""

          for ($i = 1; $i -le 15; $i++) {

            $IP = & $TS ip -4

            if ($IP) {
              break
            }

            Write-Host "Waiting for Tailscale IP..."
            Start-Sleep -Seconds 3
          }

          if (-not $IP) {
            Write-Error "Tailscale IP not found"
            exit 1
          }

          "TAILSCALE_IP=$IP" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host "Tailscale IPv4: $IP"

      # ==========================================
      # 8. TEST RDP PORT
      # ==========================================
      - name: Test RDP Port
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          $Result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($Result.TcpTestSucceeded) {

            Write-Host "RDP port 3389 is OPEN"

          } else {

            Write-Error "RDP port 3389 is NOT reachable"
            exit 1
          }

      # ==========================================
      # 9. RDP PERFORMANCE
      # ==========================================
      - name: Configure RDP Performance
        shell: powershell
        run: |
          $Path = `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          New-Item `
            -Path $Path `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $Path `
            -Name "fDisableWallpaper" `
            -Type DWord `
            -Value 1

          Set-ItemProperty `
            -Path $Path `
            -Name "fDisableFullWindowDrag" `
            -Type DWord `
            -Value 1

          Set-ItemProperty `
            -Path $Path `
            -Name "fDisableMenuAnim" `
            -Type DWord `
            -Value 1

          Set-ItemProperty `
            -Path $Path `
            -Name "fDisableThemes" `
            -Type DWord `
            -Value 1

          gpupdate /force

          Write-Host "RDP performance configured"

      # ==========================================
      # 10. RDP AUDIO
      # ==========================================
      - name: Enable RDP Audio
        shell: powershell
        run: |
          $Path = `
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"

          New-Item `
            -Path $Path `
            -Force | Out-Null

          Set-ItemProperty `
            -Path $Path `
            -Name "fDisableAudioCapture" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $Path `
            -Name "fDisableAudioPlayback" `
            -Type DWord `
            -Value 0

          Write-Host "RDP audio enabled"

      # ==========================================
      # 11. CONNECTION INFORMATION
      # ==========================================
      - name: RDP Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================="
          Write-Host "          RDP CONNECTION"
          Write-Host "======================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "Username: RDP"
          Write-Host "Password: Karthick@2026"
          Write-Host ""
          Write-Host "======================================="

      # ==========================================
      # 12. KEEP RUNNER ALIVE
      # ==========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host "RDP is running..."

          while ($true) {

            Write-Host "[$(Get-Date)] RDP ACTIVE"

            Start-Sleep -Seconds 60
          }
